[workspace]
resolver = "2"
members = ["shared", "common", "bootloader", "app"]

# Single source of truth for the firmware version. Each crate inherits
# this via `version.workspace = true`. Bumped automatically by
# `tools/bump_version.py` after a release.
[workspace.package]
version = "0.9.2"
edition = "2021"
license = "CC-BY-NC-SA-4.0"

# Default profile for firmware: small, no panic strings, LTO across crates.
[profile.release]
opt-level   = "s"
lto         = "fat"
codegen-units = 1
panic       = "abort"
debug       = true       # keep DWARF in the ELF (stripped from .bin/.hex by objcopy)
overflow-checks = false
strip       = false

[profile.dev]
opt-level   = 1          # 0 produces giant binaries that don't fit our 4K bootloader
panic       = "abort"
debug       = true
overflow-checks = true
incremental = true
