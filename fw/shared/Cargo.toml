[package]
name        = "candrive-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Types and constants shared between bootloader, common, app, and host tools."

[lib]
name = "candrive_shared"

[dependencies]
# Intentionally none — this crate must remain dependency-free so it can be
# linked into the no-std common image and the std host tooling without
# pulling in either world's runtime.
