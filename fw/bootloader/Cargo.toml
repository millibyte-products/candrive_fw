[package]
name    = "candrive-bootloader"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"

[[bin]]
name = "bootloader"
path = "src/main.rs"

[dependencies]
candrive-shared = { path = "../shared" }
cortex-m        = "0.7"
cortex-m-rt     = "0.7"
panic-halt      = "1.0"
stm32f1         = { version = "0.15", features = ["stm32f103", "rt"] }
